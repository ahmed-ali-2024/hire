name: hire
description: "Hire - AI Multi-Agent Recruitment System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  path_provider: ^2.1.2

  # Dependency Injection
  get_it: ^7.7.0
  uuid: ^4.3.3

  # Routing
  go_router: ^13.2.0

  # Functional Programming & Utilities
  fpdart: ^1.1.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  intl: ^0.20.2

  # Backend & APIs
  supabase_flutter: ^2.5.0
  http: ^1.2.1
  dio: ^5.4.1

  # File Handling
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: any # For CV parsing

  # UI & Responsive
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true # For l10n
  assets:
    - .env

